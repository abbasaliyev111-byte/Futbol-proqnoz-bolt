name: Daily Football Predictions

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-predictions:
    runs-on: ubuntu-latest
    steps:
      - name: Repo-nu cixar
        uses: actions/checkout@v4
      - name: Python qurasdir
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Paketleri qurasdir
        run: pip install requests
      - name: Config fayli yarat
        run: |
          cat > config.py << EOF
          FOOTBALL_DATA_API_KEY = "${{ secrets.FOOTBALL_DATA_API_KEY }}"
          TELEGRAM_BOT_TOKEN = "${{ secrets.TELEGRAM_BOT_TOKEN }}"
          TELEGRAM_CHAT_ID = "${{ secrets.TELEGRAM_CHAT_ID }}"
          LEAGUES_TO_TRACK = ["brasileirao", "la_liga", "bundesliga", "serie_a", "ligue_1"]
          TOP_N = 5
          EOF
      - name: Telegram baglantisini test et
        run: |
          echo "=== Telegram test ===" > debug_log.txt
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=Debug test mesaji" >> debug_log.txt 2>&1
          echo "" >> debug_log.txt
      - name: Botu ise sal
        run: python daily_run.py >> debug_log.txt 2>&1
      - name: Logu commit et
        if: always()
        run: |
          git config user.name "bot-debug"
          git config user.email "bot@example.com"
          git add debug_log.txt
          git commit -m "Debug log" || echo "no changes"
          git push
